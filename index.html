    // Build lucide icon components from the UMD bundle
    function makeIcon(name) {
      return function Icon({ size = 16, className = "", style = {} }) {
        const ref = React.useRef(null);
        useEffect(() => {
          if (ref.current && window.lucide) {
            ref.current.innerHTML = "";
            const el = document.createElement("i");
            el.setAttribute("data-lucide", name);
            el.style.width  = size + "px";
            el.style.height = size + "px";
            el.style.display = "inline-block";
            el.style.verticalAlign = "middle";
            if (style.color) el.style.color = style.color;
            ref.current.appendChild(el);
            window.lucide.createIcons({ nodes: [el] });
            const svg = el.querySelector("svg");
            if (svg) {
              svg.style.width  = size + "px";
              svg.style.height = size + "px";
              if (style.color) svg.style.color = style.color;
            }
          }
        }, [name, size, style.color]);
        return <span ref={ref} className={className} style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", ...style }} />;
      };
    }

    function daysUntil(deadline) {
      if (!deadline || deadline === "rolling" || deadline === "monitor") return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(deadline + "T00:00:00");
      return Math.ceil((d - today) / 86400000);
    }

    function deadlineColor(days) {
      if (days === null)  return "gray";
      if (days <= 14)     return "red";
      if (days <= 60)     return "amber";
      return "green";
    }

    function formatDate(s) {
      if (!s || s === "rolling" || s === "monitor") return s;
      return new Date(s + "T00:00:00").toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric" });
    }

    function exportCSV(data, filename) {
      if (!data.length) return;
      const keys = Object.keys(data[0]);
      const rows = [keys.join(","), ...data.map(r =>
        keys.map(k => `"${String(r[k]??'').replace(/"/g,'""')}"`).join(",")
      )];
      const blob = new Blob([rows.join("\n")], { type:"text/csv" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function useLocalStorage(key, initial) {
      const [value, setValue] = useState(() => {
        try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
        catch { return initial; }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);
      return [value, setValue];
    }

        if (tabFilter) {
          if (tabFilter === "identity") {
            list = list.filter(o => o.identityTags?.some(t=>["Veteran","Women","LGBTQ+","Emerging"].includes(t)));
          } else if (Array.isArray(tabFilter)) {
            list = list.filter(o => tabFilter.includes(o.type));
          }
        }
        if (search) list = list.filter(o=>o.name.toLowerCase().includes(search.toLowerCase()));
        if (filterStatus !== "All") list = list.filter(o=>o.status===filterStatus);
        if (filterTag    !== "All") list = list.filter(o=>o.identityTags?.includes(filterTag));
        if (filterType   !== "All") list = list.filter(o=>o.type===filterType);
        if (filterBOW    !== "All") list = list.filter(o=>o.bodyOfWork===filterBOW);

        if (sortBy === "deadline") {
          list.sort((a,b)=>{
            const da=daysUntil(a.deadline), db=daysUntil(b.deadline);
            if (da===null&&db===null) return 0;
            if (da===null) return 1; if (db===null) return -1;
            return da-db;
          });
        } else if (sortBy === "prize") {
          list.sort((a,b)=>{
            const pa=parseInt(a.prize?.replace(/[^0-9]/g,"")||"0");
            const pb=parseInt(b.prize?.replace(/[^0-9]/g,"")||"0");
            return pb-pa;
          });
        } else if (sortBy === "tier") {
          const order={"Tier 1":1,"Tier 2":2,"Tier 3":3,"Monthly":4,"Long Game":5};
          list.sort((a,b)=>(order[a.tier]||9)-(order[b.tier]||9));
        }
        return list;
      }, [opportunities,search,filterStatus,filterTag,filterType,filterBOW,sortBy,tabFilter]);

      function handleSave(opp) {
        setOpportunities(prev=>{
          const idx=prev.findIndex(o=>o.id===opp.id);
          if(idx>=0){const n=[...prev];n[idx]=opp;return n;}
          return [...prev,opp];
        });
        setShowModal(false); setModalOpp(null);
      }

      function handleDelete(id) {
        if (window.confirm("Delete this opportunity?"))
          setOpportunities(prev=>prev.filter(o=>o.id!==id));
      }

      const selCls = "rounded border border-gray-300 px-2 py-1.5 text-xs focus:outline-none";

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center gap-2">
            <div className="relative flex-1" style={{minWidth:"180px"}}>
              <Search size={14} className="absolute left-2.5 text-gray-400" style={{top:"50%",transform:"translateY(-50%)"}}/>
              <input className="w-full rounded border border-gray-300 pl-8 pr-3 py-1.5 text-sm focus:outline-none"
                style={{backgroundColor:COLORS.cream}}
                placeholder="Search opportunities…" value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
            <select className={selCls} style={{backgroundColor:COLORS.cream}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
              <option value="All">All Statuses</option>
              {STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
            <select className={selCls} style={{backgroundColor:COLORS.cream}} value={filterTag} onChange={e=>setFilterTag(e.target.value)}>
              <option value="All">All Tags</option>
              {IDENTITY_TAGS.map(t=><option key={t}>{t}</option>)}
            </select>
            {!tabFilter && (
              <select className={selCls} style={{backgroundColor:COLORS.cream}} value={filterType} onChange={e=>setFilterType(e.target.value)}>
                <option value="All">All Types</option>
                {TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            )}
            <select className={selCls} style={{backgroundColor:COLORS.cream}} value={filterBOW} onChange={e=>setFilterBOW(e.target.value)}>
              <option value="All">All Series</option>
              {BODIES_OF_WORK.map(b=><option key={b}>{b}</option>)}
            </select>
            <select className={selCls} style={{backgroundColor:COLORS.cream}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
              <option value="deadline">Sort: Deadline</option>
              <option value="prize">Sort: Prize</option>
              <option value="tier">Sort: Tier</option>
            </select>
            <button onClick={()=>exportCSV(filtered,"opportunities.csv")}
              className="flex items-center gap-1 px-3 py-1.5 rounded border border-gray-300 text-xs hover:bg-gray-100 font-medium">
              <Download size={13}/> CSV
            </button>
            <button onClick={()=>{setModalOpp(null);setShowModal(true);}}
              className="flex items-center gap-1 px-3 py-1.5 rounded text-xs font-semibold"
              style={{backgroundColor:COLORS.rust, color:COLORS.cream}}>
              <Plus size={13}/> Add
            </button>
          </div>

          <p className="text-xs text-gray-400">{filtered.length} record{filtered.length!==1?"s":""}</p>

          <div className="space-y-2">
            {filtered.length === 0 ? (
              <div className="text-center py-12 text-gray-400 text-sm">No opportunities match your filters.</div>
            ) : filtered.map(o=>(
              <OppCard key={o.id} opp={o}
                onEdit={o=>{setModalOpp(o);setShowModal(true);}}
                onDelete={handleDelete}/>
            ))}
          </div>

          {showModal && (
            <OppModal opp={modalOpp} onSave={handleSave} onClose={()=>{setShowModal(false);setModalOpp(null);}}/>
          )}
        </div>
      );
    }

    // ─── Submission Log Tab ───────────────────────────────────────────────────

    function SubmissionLogTab({ log, setLog }) {
      const [showModal, setShowModal] = useState(false);
      const [editEntry, setEditEntry] = useState(null);

      const thisYear = new Date().getFullYear();
      const wins = log.filter(e=>["Awarded","Shortlisted"].includes(e.outcome)).length;
      const winRate = log.length ? Math.round((wins/log.length)*100) : 0;
      const seriesCount = BODIES_OF_WORK.reduce((acc,b)=>{acc[b]=log.filter(e=>e.bodyOfWork===b).length;return acc;},{});
      const topSeries = Object.entries(seriesCount).sort((a,b)=>b[1]-a[1])[0];

      function handleSave(entry) {
        setLog(prev=>{
          const idx=prev.findIndex(e=>e.id===entry.id);
          if(idx>=0){const n=[...prev];n[idx]=entry;return n;}
          return [...prev,entry];
        });
        setShowModal(false); setEditEntry(null);
      }

      function handleDelete(id) {
        if (window.confirm("Delete this log entry?")) setLog(prev=>prev.filter(e=>e.id!==id));
      }

      const OC = {
        "Awarded":"bg-green-100 text-green-700 border-green-300",
        "Shortlisted":"bg-purple-100 text-purple-700 border-purple-300",
        "Not Selected":"bg-gray-100 text-gray-500 border-gray-300",
        "Pending":"bg-yellow-100 text-yellow-700 border-yellow-300",
        "Declined":"bg-red-100 text-red-500 border-red-300",
      };

      return (
        <div className="space-y-5">
          <div className="grid grid-cols-2 gap-4" style={{gridTemplateColumns:"repeat(4, minmax(0,1fr))"}}>
            {[
              {label:"Total Submitted",       value:log.length},
              {label:`This Year (${thisYear})`,value:log.filter(e=>e.dateSubmitted?.startsWith(String(thisYear))).length},
              {label:"Win / Shortlist Rate",   value:`${winRate}%`},
              {label:"Top Series",             value:topSeries?.[0]||"—"},
            ].map(c=>(
              <div key={c.label} className="rounded-xl border border-gray-200 bg-white p-4">
                <div className="text-xl font-bold" style={{color:COLORS.nearBlack}}>{c.value}</div>
                <div className="text-xs text-gray-400 mt-0.5">{c.label}</div>
              </div>
            ))}
          </div>

          <div className="flex items-center justify-between">
            <h3 className="text-sm font-bold uppercase tracking-wide" style={{color:COLORS.nearBlack}}>Submission Log</h3>
            <div className="flex gap-2">
              <button onClick={()=>exportCSV(log,"submission_log.csv")}
                className="flex items-center gap-1 px-3 py-1.5 rounded border border-gray-300 text-xs hover:bg-gray-100 font-medium">
                <Download size={13}/> CSV
              </button>
              <button onClick={()=>{setEditEntry(null);setShowModal(true);}}
                className="flex items-center gap-1 px-3 py-1.5 rounded text-xs font-semibold"
                style={{backgroundColor:COLORS.rust, color:COLORS.cream}}>
                <Plus size={13}/> Log Submission
              </button>
            </div>
          </div>

          <div className="space-y-2">
            {log.length === 0 ? (
              <div className="text-center py-12 text-gray-400 text-sm">No submissions logged yet.</div>
            ) : [...log].sort((a,b)=>(b.dateSubmitted||"").localeCompare(a.dateSubmitted||"")).map(entry=>(
              <div key={entry.id} className="bg-white rounded-lg border border-gray-200 p-4">
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap mb-1">
                      <span className={`inline-flex items-center px-2 py-0.5 rounded border text-xs font-medium ${OC[entry.outcome]||""}`}>
                        {entry.outcome}
                      </span>
                      <span className="text-xs text-gray-400">{formatDate(entry.dateSubmitted)}</span>
                    </div>
                    <p className="font-semibold text-sm" style={{color:COLORS.nearBlack}}>{entry.opportunityName}</p>
                    <p className="text-xs text-gray-500 mt-0.5">
                      <BookOpen size={10}/> {entry.bodyOfWork}
                    </p>
                    {entry.notes && (
                      <p className="text-xs text-gray-500 mt-2 leading-relaxed border-t border-gray-100 pt-2">{entry.notes}</p>
                    )}
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button onClick={()=>{setEditEntry(entry);setShowModal(true);}} className="p-1.5 rounded hover:bg-gray-100 text-gray-400"><Edit2 size={13}/></button>
                    <button onClick={()=>handleDelete(entry.id)} className="p-1.5 rounded hover:bg-red-50 text-gray-400"><Trash2 size={13}/></button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {showModal && (
            <LogModal entry={editEntry} onSave={handleSave} onClose={()=>{setShowModal(false);setEditEntry(null);}}/>
          )}
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────

    const NAV_ITEMS = [
      { id:"home",        label:"Dashboard",                icon:BarChart2,   tabFilter:null },
      { id:"residencies", label:"Residencies & Fellowships", icon:BookOpen,    tabFilter:null },
      { id:"grants",      label:"Grants",                   icon:Award,       tabFilter:null },
      { id:"contests",    label:"Contests & Awards",         icon:Tag,         tabFilter:null },
      { id:"identity",    label:"Identity-Based",            icon:Layers,      tabFilter:"identity" },
      { id:"log",         label:"Submission Log",            icon:Calendar,    tabFilter:null },
    ];

    const TAB_TYPE_MAP = {
      residencies:["residency","fellowship"],
      grants:["grant"],
      contests:["contest","award"],
    };

    function App() {
      const [opportunities, setOpportunities] = useLocalStorage("hcs_opportunities", SAMPLE_OPPORTUNITIES);
      const [log,           setLog]           = useLocalStorage("hcs_log",           SAMPLE_LOG);
      const [activeTab,     setActiveTab]     = useState("home");
      const [sidebarOpen,   setSidebarOpen]   = useState(false);

      function getTabFilter(tabId) {
        if (tabId === "identity") return "identity";
        if (TAB_TYPE_MAP[tabId])  return TAB_TYPE_MAP[tabId];
        return null;
      }

      function getCount(tabId) {
        if (tabId === "log")  return log.length;
        if (tabId === "home") return null;
        const f = getTabFilter(tabId);
        if (f === "identity") return opportunities.filter(o=>o.identityTags?.some(t=>["Veteran","Women","LGBTQ+","Emerging"].includes(t))).length;
        if (Array.isArray(f)) return opportunities.filter(o=>f.includes(o.type)).length;
        return opportunities.length;
      }

      const currentNav = NAV_ITEMS.find(n=>n.id===activeTab);

      return (
        <div className="min-h-screen flex flex-col" style={{backgroundColor:COLORS.cream, fontFamily:"'Inter', system-ui, sans-serif"}}>
          {/* Header */}
          <header className="border-b border-gray-200 sticky top-0 z-40" style={{backgroundColor:"rgba(255,255,255,0.9)", backdropFilter:"blur(8px)"}}>
            <div className="max-w-screen-xl mx-auto px-4 py-3 flex items-center gap-3">
              <button className="md:hidden p-1.5 rounded hover:bg-gray-100" onClick={()=>setSidebarOpen(o=>!o)}>
                <Filter size={18} style={{color:COLORS.rust}}/>
              </button>
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg flex items-center justify-center" style={{backgroundColor:COLORS.rust}}>
                  <Award size={14} style={{color:COLORS.cream}}/>
                </div>
                <div>
                  <span className="font-bold text-sm leading-none block" style={{color:COLORS.nearBlack}}>Opportunity Tracker</span>
                  <span className="text-xs text-gray-400 leading-none">Harper Collab Studio</span>
                </div>
              </div>
              <div className="ml-auto">
                <span className="text-xs text-gray-400 hidden sm:block">
                  {opportunities.length} opportunities · {log.length} submissions
                </span>
              </div>
            </div>
          </header>

          <div className="flex flex-1" style={{maxWidth:"1280px", margin:"0 auto", width:"100%"}}>
            {/* Sidebar backdrop */}
            {sidebarOpen && (
              <div className="fixed inset-0 z-20 md:hidden" style={{backgroundColor:"rgba(0,0,0,0.3)"}}
                onClick={()=>setSidebarOpen(false)}/>
            )}

            {/* Sidebar */}
            <aside className="border-r border-gray-200 flex flex-col py-4"
              style={{
                width:"224px", flexShrink:0, backgroundColor:"white",
                position: window.innerWidth < 768 ? "fixed" : "sticky",
                top:0, height:"100vh",
                transform: sidebarOpen || window.innerWidth >= 768 ? "translateX(0)" : "translateX(-100%)",
                transition:"transform 0.2s",
                zIndex: window.innerWidth < 768 ? 30 : "auto",
              }}>
              {sidebarOpen && (
                <button className="absolute top-3 right-3 p-1 rounded hover:bg-gray-100"
                  style={{display: window.innerWidth >= 768 ? "none" : "block"}}
                  onClick={()=>setSidebarOpen(false)}>
                  <X size={16}/>
                </button>
              )}

              <nav className="flex flex-col gap-0.5 px-3">
                {NAV_ITEMS.map(item=>{
                  const active = activeTab === item.id;
                  const count  = getCount(item.id);
                  return (
                    <button key={item.id}
                      onClick={()=>{setActiveTab(item.id);setSidebarOpen(false);}}
                      className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-left w-full"
                      style={{
                        backgroundColor: active ? COLORS.rust : "transparent",
                        color: active ? COLORS.cream : "#4b5563",
                        transition:"background-color 0.15s",
                      }}>
                      <item.icon size={15}/>
                      <span style={{flex:1, lineHeight:1.3}}>{item.label}</span>
                      {count !== null && (
                        <span className="text-xs rounded-full px-1.5 py-0.5 font-semibold"
                          style={{
                            backgroundColor: active ? "rgba(255,255,255,0.2)" : "#f3f4f6",
                            color: active ? COLORS.cream : "#6b7280",
                          }}>
                          {count}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Tier Legend */}
              <div className="mt-auto px-4 pb-3 pt-4 border-t border-gray-100">
                <p className="text-xs text-gray-400 uppercase tracking-wide font-semibold mb-2">Tier Legend</p>
                {Object.entries(TIER_STYLES).map(([tier,s])=>(
                  <div key={tier} className="flex items-center gap-2 mb-1.5">
                    <span className="w-5 h-5 rounded flex items-center justify-center text-xs font-bold"
                      style={{backgroundColor:s.bg, color:COLORS.cream, fontSize:"10px"}}>{s.label}</span>
                    <span className="text-xs text-gray-500">{tier}</span>
                  </div>
                ))}
              </div>
            </aside>

            {/* Main */}
            <main className="flex-1 min-w-0 p-4 md:p-6" style={{paddingTop:"1.5rem"}}>
              {activeTab === "home" && <DashboardHome opportunities={opportunities}/>}
              {activeTab === "log"  && <SubmissionLogTab log={log} setLog={setLog}/>}
              {["residencies","grants","contests","identity"].includes(activeTab) && (
                <div>
                  <h2 className="text-xl font-bold mb-1" style={{color:COLORS.nearBlack}}>{currentNav?.label}</h2>
                  <p className="text-sm text-gray-400 mb-4">
                    {activeTab === "identity"
                      ? "Opportunities tagged Veteran, Women, LGBTQ+, or Emerging"
                      : `${TAB_TYPE_MAP[activeTab]?.map(t=>t.charAt(0).toUpperCase()+t.slice(1)).join(" & ")} opportunities`}
                  </p>
                  <OpportunitiesTab
                    opportunities={opportunities}
                    setOpportunities={setOpportunities}
                    tabFilter={activeTab==="identity" ? "identity" : TAB_TYPE_MAP[activeTab]}
                  />
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
